[workspace]
members = [
    "crates/protocol",
    "crates/transport",
    "crates/engine",
    "crates/worker",
    "crates/ime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
goblin = "0.10.7"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_arm"] }
windows = "0.62.2"
windows-core = "0.62.2"
simeji-engine = { path = "crates/engine" }
simeji-protocol = { path = "crates/protocol" }
simeji-transport = { path = "crates/transport" }
