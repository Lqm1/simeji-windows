[package]
name = "simeji-windows"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
goblin = "0.10.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_arm"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
