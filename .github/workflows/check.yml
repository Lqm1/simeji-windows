name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install libclang ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clangPath = python -c "import clang, pathlib; print(pathlib.Path(clang.__file__).parent / 'native')"
          "LIBCLANG_PATH=$clangPath" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/simeji-target" >> $env:GITHUB_ENV
          rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
